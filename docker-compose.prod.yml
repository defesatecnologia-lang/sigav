services:
  backend:
    container_name: controle-share-videos-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    # Internal network only — no direct external access (INFRA-HIGH-02)
    networks:
      - backend-net
    # Health check for orchestrator (INFRA-HIGH-02)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 3
    # Resource limits (INFRA-HIGH-02)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
          pids: 512
        reservations:
          memory: 512M
          cpus: "0.5"
    # Logging with rotation (INFRA-HIGH-02)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Hardening: read-only root filesystem (Phase 2)
    read_only: true
    tmpfs:
      - /tmp:size=256M
      - /run:size=16M
      - /var/cache:size=32M
    # Hardening: capabilities, no-new-privileges, seccomp (Phase 1)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp/default.json
    # Environment from secrets (INFRA-MED-04)
    # DATA_ROOT = raiz única de persistência (RAID6 externo montado no host).
    # Banco SQLite + uploads + auditoria ficam dentro dela. Sobrescreva com
    # DATA_ROOT=<path> no ambiente do `docker compose` se o mount mudar.
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=true
      - BACKEND_PORT=8080
      - DATA_ROOT=${DATA_ROOT:-/mnt/sstv-sigav}
      - DATABASE_URL=file:${DATA_ROOT:-/mnt/sstv-sigav}/controle-videos.db
      - DATA_DIRECTORY=${DATA_ROOT:-/mnt/sstv-sigav}
      - CADDY_DISABLED=true
      # Admin bootstrap from Docker secrets (file-based env so seed reads them)
      - ADMIN_EMAIL_FILE=/run/secrets/admin_email
      - ADMIN_USERNAME_FILE=/run/secrets/admin_username
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
    # Secrets injected at runtime (INFRA-MED-04)
    secrets:
      - admin_email
      - admin_username
      - admin_password
      - smtp_password
      - acme_email
      - domain
      - jwt_secret
    # Bind mount do RAID6 externo — dados fora do ciclo de vida do container.
    # Caminho host = caminho container (${DATA_ROOT:-/mnt/sstv-sigav}) para
    # simplificar backup e restore executados no host (DB, uploads, audit-worm).
    # O mount DEVE existir no host antes do `up` (ver
    # docs/operacional/STORAGE-EXTERNO-RAID6.md); sem fallback para disco local.
    # (PLANO_HARDENING_DOCKER item 11) UID/GID consistente: host 1002:1002 =
    # container 1002:1002 (create-user.sh defaults PUID=1002/PGID=1002; runner
    # stage cria controle-user UID 1002). SELinux desativado no host → :z é
    # no-op; mantém-se :z (label compartilhado) e não :Z porque backend e
    # frontend montam o MESMO diretório images — :Z (private) causaria conflito
    # de relabeling entre os dois containers em hosts SELinux.
    volumes:
      - ${DATA_ROOT:-/mnt/sstv-sigav}:${DATA_ROOT:-/mnt/sstv-sigav}:rw,z
      - ${DATA_ROOT:-/mnt/sstv-sigav}/images:/opt/app/frontend/public/img:rw,z
    # Entrypoint runs migrations, seed, then starts servers via Caddy
    entrypoint: ["sh", "./scripts/docker/create-user.sh"]
    command: ["sh", "./scripts/docker/entrypoint.sh"]

  frontend:
    container_name: controle-share-videos-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runner
      args:
        # Versão exibida no rodapé; exportada pelo deploy-prod.sh a cada deploy.
        - APP_VERSION=${APP_VERSION:-}
        # SSR/middleware Next e rewrites /api chamam o backend da rede interna.
        # Sem isto o default do Dockerfile (localhost:3000) aponta para o
        # próprio container frontend e quebra /api/users/me no SSR e no proxy.
        - API_URL=http://backend:8080
    restart: unless-stopped
    networks:
      - backend-net
    # Start the Next.js standalone server (runtime stage does not define a CMD)
    command: ["sh", "-c", "cd /opt/app/frontend && PORT=3333 HOSTNAME=0.0.0.0 node server.js"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3333"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
          pids: 512
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Hardening: read-only root filesystem (Phase 2)
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /run:size=8M
    # Hardening: capabilities, no-new-privileges, seccomp (Phase 1)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp/default.json
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOSTNAME=0.0.0.0
      - API_URL=http://backend:8080
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - domain
      - jwt_secret
    # Bind mount no RAID6 externo — imagens compartilhadas com o backend
    # (host: 1002:1002, mesma raiz DATA_ROOT).
    # (PLANO_HARDENING_DOCKER item 11) :z (compartilhado) e não :Z porque o
    # mesmo diretório também é montado pelo backend.
    volumes:
      - ${DATA_ROOT:-/mnt/sstv-sigav}/images:/opt/app/frontend/public/img:rw,z

  caddy:
    container_name: controle-share-videos-caddy
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
          pids: 512
        reservations:
          memory: 64M
          cpus: "0.05"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Hardening: read-only root filesystem (Phase 2)
    read_only: true
    tmpfs:
      - /tmp:size=64M
    # Hardening: capabilities, no-new-privileges, seccomp (Phase 1)
    # Caddy needs NET_BIND_SERVICE for binding to privileged ports 80/443
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp/default.json
    volumes:
      # CADDYFILE seleciona a config do Caddy: prod (TLS Let's Encrypt,
      # default) | ip (HTTP/IP, Caddyfile.ip) | local (porta 3000).
      # Para LAN sem domínio use o overlay docker-compose.lan-prod.yml, que
      # monta Caddyfile.lan-prod (TLS autoassinado na porta 5000).
      # Em Swarm, os secrets DOMAIN/ACME_EMAIL só são usados pelo Caddyfile.prod.
      - ./reverse-proxy/Caddyfile.${CADDYFILE:-prod}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    secrets:
      - acme_email
      - domain
    environment:
      - ACME_EMAIL_FILE=/run/secrets/acme_email
      - DOMAIN_FILE=/run/secrets/domain

networks:
  # Internal network — containers can communicate but have no internet access
  # and no direct external exposure. Only Caddy receives traffic via published
  # host ports (80/443).
  backend-net:
    driver: bridge
    name: controle-share-videos-backend
    internal: true

# Bind mounts replace named volumes so persistent data lives on the external
# RAID6 volume at ${DATA_ROOT:-/mnt/sstv-sigav} (DB + uploads + audit-worm)
# rather than in /var/lib/docker/volumes. Only caddy-data and caddy-config
# remain as named volumes (let's-encrypt state, not user data).
volumes:
  caddy-data:
    driver: local
  caddy-config:
    driver: local

secrets:
  # File-based secrets: compatível com `docker compose up` (não-Swarm).
  # `external: true` é suportado apenas por Swarm/`docker stack deploy` e
  # falha com "unsupported external secret" no `docker compose up`.
  #
  # Crie os arquivos em ${SECRETS_DIR:-./scripts/secrets} no host, com 0600,
  # ANTES do `up`. O diretório já é gitignored e excluído do build context.
  # Ex.: printf '%s' 'admin@empresa.local' > ./scripts/secrets/admin_email
  #     openssl rand -base64 48 > ./scripts/secrets/admin_password
  #
  # Nota: o JWT secret é compartilhado entre backend e frontend e também fica
  # persistido no banco (config.seed.ts, internal.jwtSecret, locked=true).
  admin_email:
    file: ${SECRETS_DIR:-./scripts/secrets}/admin_email
  admin_username:
    file: ${SECRETS_DIR:-./scripts/secrets}/admin_username
  admin_password:
    file: ${SECRETS_DIR:-./scripts/secrets}/admin_password
  smtp_password:
    file: ${SECRETS_DIR:-./scripts/secrets}/smtp_password
  acme_email:
    file: ${SECRETS_DIR:-./scripts/secrets}/acme_email
  domain:
    file: ${SECRETS_DIR:-./scripts/secrets}/domain
  jwt_secret:
    file: ${SECRETS_DIR:-./scripts/secrets}/jwt_secret
