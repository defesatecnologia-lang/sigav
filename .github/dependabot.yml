# Dependabot — atualizações de versão por projeto (lockfiles independentes).
# Security updates continuam ativos por padrão e passam a respeitar esta config.
version: 2
updates:
  # Mantém os pins de actions (SHA) atualizados nas 3 workflows.
  - package-ecosystem: github-actions
    directory: /
    # A default branch é main (produção); as atualizações entram primeiro na
    # branch de integração, que depois abre PR para main.
    target-branch: fix/dev-development
    schedule:
      interval: weekly

  # Backend NestJS
  - package-ecosystem: npm
    directory: /backend
    # A default branch é main (produção); as atualizações entram primeiro na
    # branch de integração, que depois abre PR para main.
    target-branch: fix/dev-development
    schedule:
      interval: weekly
    # ts-jest 29 (usado pelo Jest do backend) declara peer typescript
    # ">=4.3 <7" e typescript-eslint 8 também não suporta TS 7: o npm ci
    # falha com ERESOLVE se o dependabot bumpar o typescript para 7.x.
    # Reavaliar quando ts-jest e typescript-eslint suportarem TS >= 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # check-disk-space@4 é ESM-only e removeu o export default; o backend
      # é CommonJS e usa Jest, então build e testes falham com TS2349.
      # Reavaliar quando o backend migrar para ESM.
      - dependency-name: check-disk-space
        versions: ["4.x"]

  # Frontend Next.js
  - package-ecosystem: npm
    directory: /frontend
    # A default branch é main (produção); as atualizações entram primeiro na
    # branch de integração, que depois abre PR para main.
    target-branch: fix/dev-development
    schedule:
      interval: weekly
    # typescript-eslint (e o eslint-config-next que o embute) ainda não
    # suporta TS 7.0 — o lint falha com "typescript-eslint does not support
    # TS 7.0". Reavaliar quando o suporte a TS >= 7.1 for publicado:
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # @mantine/core@9.8.1 declara peer exato @mantine/hooks@"9.8.1" (assim
      # como @mantine/modals e @mantine/notifications). Um bump isolado do
      # hooks para 9.8.2+ quebra o `npm ci` com ERESOLVE (PR #44): todos os
      # jobs que instalam dependências falham. Ignorar até que core, form,
      # hooks, modals e notifications sejam atualizados JUNTOS para 9.8.2+;
      # ao fazer esse bump coordenado, remover esta regra.
      - dependency-name: "@mantine/hooks"
        versions: [">=9.8.2"]

  # Pacote compartilhado
  - package-ecosystem: npm
    directory: /packages/shared
    # A default branch é main (produção); as atualizações entram primeiro na
    # branch de integração, que depois abre PR para main.
    target-branch: fix/dev-development
    schedule:
      interval: weekly
    # Mantém o compilador do pacote alinhado a backend e frontend (TS 6).
    # O bump para 7.x reintroduz a divergência nos lockfiles que dependem
    # de file:../packages/shared e o bump do backend é rejeitado no CI.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]

  # Suíte E2E (Playwright)
  - package-ecosystem: npm
    directory: /e2e
    # A default branch é main (produção); as atualizações entram primeiro na
    # branch de integração, que depois abre PR para main.
    target-branch: fix/dev-development
    schedule:
      interval: weekly

  # Scripts de operação/deploy
  - package-ecosystem: npm
    directory: /scripts
    # A default branch é main (produção); as atualizações entram primeiro na
    # branch de integração, que depois abre PR para main.
    target-branch: fix/dev-development
    schedule:
      interval: weekly
